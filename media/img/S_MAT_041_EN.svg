<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img"><rect width="960" height="380" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#24374a"/></marker></defs><g font-family="DejaVu Sans, sans-serif" fill="#152536"><text x="480" y="44" text-anchor="middle" font-size="29" font-weight="bold">Euclidean algorithm</text><rect x="25" y="105" width="260" height="116" rx="10" fill="#f5f8fb" stroke="#8195a5" stroke-width="2"/><text x="155" y="148" text-anchor="middle" font-size="23" font-weight="normal">252 = 2 · 105 + 42</text><text x="155" y="189" text-anchor="middle" font-size="22" font-weight="bold">Remainder 42</text><rect x="350" y="105" width="260" height="116" rx="10" fill="#f5f8fb" stroke="#8195a5" stroke-width="2"/><text x="480" y="148" text-anchor="middle" font-size="23" font-weight="normal">105 = 2 · 42 + 21</text><text x="480" y="189" text-anchor="middle" font-size="22" font-weight="bold">Remainder 21</text><rect x="675" y="105" width="260" height="116" rx="10" fill="#f5f8fb" stroke="#8195a5" stroke-width="2"/><text x="805" y="148" text-anchor="middle" font-size="23" font-weight="normal">42 = 2 · 21 + 0</text><text x="805" y="189" text-anchor="middle" font-size="22" font-weight="bold">Remainder 0</text><path d="M285 163 L345 163" stroke="#24374a" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M610 163 L670 163" stroke="#24374a" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="480" y="275" text-anchor="middle" font-size="25" font-weight="bold">Last positive remainder: gcd = 21</text><text x="480" y="325" text-anchor="middle" font-size="23" font-weight="normal">21 = 5 · 105 − 2 · 252</text></g></svg>