<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Sine and cosine on the unit circle</title><desc>A circle with radius one. At 30 degrees, the point has x = square root of three divided by two and y = one half.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1"/><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1"/><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Sine and cosine on the unit circle</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Point at 30° or π/6</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><circle cx="332.00" cy="350.00" r="190" fill="none" stroke="#286fba" stroke-width="3"/><line x1="111.00" y1="350.00" x2="563.00" y2="350.00" stroke="#253d59" stroke-width="2" stroke-linecap="round"/><line x1="332.00" y1="127.00" x2="332.00" y2="560.00" stroke="#253d59" stroke-width="2" stroke-linecap="round"/><line x1="332.00" y1="350.00" x2="496.54" y2="255.00" stroke="#286fba" stroke-width="4" stroke-linecap="round"/><line x1="496.54" y1="255.00" x2="496.54" y2="350.00" stroke="#bc6924" stroke-width="4" stroke-linecap="round"/><line x1="332.00" y1="350.00" x2="496.54" y2="350.00" stroke="#347b65" stroke-width="4" stroke-linecap="round"/><circle cx="496.54" cy="255.00" r="7" fill="#ffffff" stroke="#286fba" stroke-width="3"/><polyline points="372.00,350.00 371.99,349.30 371.98,348.60 371.95,347.91 371.90,347.21 371.85,346.51 371.78,345.82 371.70,345.13 371.61,344.43 371.51,343.74 371.39,343.05 371.27,342.37 371.13,341.68 370.97,341.00 370.81,340.32 370.64,339.65 370.45,338.97 370.25,338.31 370.04,337.64 369.82,336.98 369.59,336.32 369.34,335.67 369.09,335.02 368.82,334.37 368.54,333.73 368.25,333.10 367.95,332.47 367.64,331.84 367.32,331.22 366.98,330.61 366.64,330.00" fill="none" stroke="#61758a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="382" y="337" fill="#253d59" font-size="17" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">30°</text><text x="411.5448267190434" y="291.0" fill="#286fba" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">1</text><text x="402" y="378" fill="#347b65" font-size="17" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">cos 30°</text><text x="504.5448267190434" y="302.5" fill="#bc6924" font-size="17" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">sin 30°</text><text x="605" y="214" fill="#253d59" font-size="21" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">P = (cos α, sin α)</text><text x="605" y="274" fill="#347b65" font-size="18" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">cos 30° = √3/2</text><text x="605" y="318" fill="#bc6924" font-size="18" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">sin 30° = 1/2</text><text x="605" y="362" fill="#253d59" font-size="18" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">α = π/6</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">The x-value is the cosine; the y-value is the sine.</text></svg>