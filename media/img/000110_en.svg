<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Zwei Geraden können sich schneiden, parallel oder windschief sein."><title>Lines in three-dimensional space</title><desc>Two lines may intersect, be parallel or be skew.</desc><rect width="960" height="600" fill="#ffffff"/><rect x="0" y="0" width="960" height="9" fill="#ffffff"/><text x="48" y="52" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#192b47">Lines in three-dimensional space</text><line x1="48" y1="92" x2="912" y2="92" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><rect x="53" y="144" width="231" height="309" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><text x="168" y="191" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#192b47">Intersecting</text><line x1="103" y1="249" x2="237" y2="374" stroke="#356dda" stroke-width="5" stroke-linecap="round"/><line x1="107" y1="367" x2="231" y2="254" stroke="#ee9a32" stroke-width="5" stroke-linecap="round"/><circle cx="169" cy="311" r="8" fill="#15978f"/><rect x="365" y="144" width="231" height="309" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><text x="480" y="191" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#192b47">Parallel</text><line x1="413" y1="259" x2="550" y2="360" stroke="#356dda" stroke-width="5" stroke-linecap="round"/><line x1="413" y1="313" x2="550" y2="414" stroke="#ee9a32" stroke-width="5" stroke-linecap="round"/><rect x="676" y="144" width="231" height="309" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><text x="791" y="191" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#192b47">Skew</text><polygon points="721.0,319.0 841.0,280.0 882.0,305.0 762.0,344.0" fill="#e0ecf8" stroke="#a1b6d0" stroke-width="2"/><line x1="730" y1="393" x2="848" y2="252" stroke="#356dda" stroke-width="5" stroke-linecap="round"/><line x1="737" y1="283" x2="864" y2="342" stroke="#ee9a32" stroke-width="5" stroke-linecap="round"/><text x="791" y="419" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#586b84">no intersection in space</text><line x1="48" y1="544" x2="912" y2="544" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="48" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#586b84">Skew lines are neither parallel nor intersecting.</text></svg>