<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Combinatorics: counting all combinations</title><desc>A tree diagram with two algorithm branches A and B, each branching into three file formats 1, 2 and 3: six combinations, with no statement about probability.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1"/><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1"/><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Combinatorics: counting all combinations</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Two algorithms × three formats = six test cases</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><text x="82" y="160" fill="#61758a" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Choice</text><rect x="54" y="272" width="145" height="66" fill="#dcecff" stroke="#286fba" rx="12" stroke-width="2"/><text x="126" y="312" fill="#253d59" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Test run</text><line x1="199.00" y1="305.00" x2="333.00" y2="238.00" stroke="#286fba" stroke-width="3" stroke-linecap="round"/><polygon points="333.00,238.00 326.54,246.91 322.00,237.82" fill="#286fba" stroke="#286fba" stroke-width="0"/><rect x="333" y="211" width="186" height="54" fill="#dcecff" stroke="#286fba" rx="9" stroke-width="2"/><text x="426" y="245" fill="#253d59" font-size="16" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Algorithm A</text><line x1="519.00" y1="238.00" x2="605.00" y2="190.00" stroke="#bc6924" stroke-width="2" stroke-linecap="round"/><polygo