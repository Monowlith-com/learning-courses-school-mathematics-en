<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Der Funktionsgraph f(x)=2x+3 über dem Intervall null bis zwei und die darunter liegende positive Fläche von zehn Flächeneinheiten. Es gilt F(2) minus F(0) gleich zehn.">
<title>Signed area and antiderivative</title>
<desc>The graph f(x) = 2x + 3 on the interval from zero to two, with a positive area of ten square units beneath it. F(2) minus F(0) equals ten.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2976BD"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8793A6"/></marker></defs>
<rect width="960" height="600" fill="#FFFFFF"/>
<rect x="16" y="16" width="928" height="568" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
<text x="44" y="62" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start">Signed area and antiderivative</text>
<text x="44" y="91" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">Example f(x) = 2x + 3; F(x) = x² + 3x + C</text>
<line x1="42" y1="107" x2="918" y2="107" stroke="#CBD5E1" stroke-width="1.6" stroke-linecap="round"/>
<line x1="135" y1="492" x2="746" y2="492" stroke="#243047" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="165" y1="515" x2="165" y2="151" stroke="#243047" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="165" y="520" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">0</text>
<text x="345" y="520" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">1</text>
<text x="525" y="520" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">2</text>
<text x="705" y="520" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle">3</text>
<text x="147" y="499" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end">0</text>
<text x="147" y="403" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end">3</text>
<text x="147" y="339" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end">5</text>
<text x="147" y="275" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end">7</text>
<text x="147" y="211" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="end">9</text>
<polygon points="165,492 525,492 525,268 165,396" fill="#EAF4FF" stroke="none"/>
<line x1="525" y1="492" x2="525" y2="268" stroke="#2976BD" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 5"/>
<line x1="165" y1="396" x2="705" y2="204" stroke="#2976BD" stroke-width="4" stroke-linecap="round"/>
<text x="763" y="205" fill="#2976BD" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start">f(x) = 2x + 3</text>
<text x="440" y="383" fill="#2976BD" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Area = 10</text>
<text x="46" y="560" fill="#5A6575" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">F(2) − F(0) = (4 + 6) − 0 = 10. The indefinite integral includes + C.</text>
</svg>