<text x="304" y="341" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">−2</text>
<line x1="392" y1="288" x2="392" y2="312" stroke="#8793A6" stroke-width="2" stroke-linecap="round"/>
<text x="392" y="341" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">−1</text>
<line x1="480" y1="288" x2="480" y2="312" stroke="#243047" stroke-width="2" stroke-linecap="round"/>
<text x="480" y="341" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">0</text>
