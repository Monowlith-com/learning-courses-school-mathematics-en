<line x1="128" y1="288" x2="128" y2="312" stroke="#8793A6" stroke-width="2" stroke-linecap="round"/>
<text x="128" y="341" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">−4</text>
<line x1="216" y1="288" x2="216" y2="312" stroke="#8793A6" stroke-width="2" stroke-linecap="round"/>
<text x="216" y="341" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">−3</text>
