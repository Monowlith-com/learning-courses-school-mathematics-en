<text x="744" y="341" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">3</text>
<line x1="832" y1="288" x2="832" y2="312" stroke="#8793A6" stroke-width="2" stroke-linecap="round"/>
<text x="832" y="341" fill="#243047" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle">4</text>
