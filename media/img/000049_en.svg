<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Zahlenstrahl von minus vier bis plus vier. Von minus drei führen fünf Schritte nach rechts bis plus zwei. Der Betrag von minus drei ist drei.">
<title>Number line and signs</title>
<desc>Number line from −4 to +4. Five steps to the right from −3 reach +2. The absolute value of −3 is 3.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2976BD"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8793A6"/></marker></defs>
<rect width="960" height="600" fill="#FFFFFF"/>
