<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Der Ausreißer 12 zieht den Mittelwert nach oben, während der Median zwei bleibt."><title>Mean and median with outliers</title><desc>The outlier 12 pulls the mean upwards while the median remains two.</desc><rect width="960" height="600" fill="#ffffff"/><rect x="0" y="0" width="960" height="9" fill="#ffffff"/><text x="48" y="52" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#192b47">Mean and median with outliers</text><line x1="48" y1="92" x2="912" y2="92" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="72" y="162" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#192b47">Data values:  1   2   2   3   12</text><line x1="105" y1="290" x2="847" y2="290" stroke="#192b47" stroke-width="3" stroke-linecap="round"/><polygon points="847.0,290.0 836.4,295.5 836.4,284.5" fill="#192b47"/><line x1="105.0" y1="282" x2="105.0" y2="298" stroke="#586b84" stroke-width="2" stroke-linecap="round"/><text x="105.0" y="326" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#586b84">0</text><line x1="211.0" y1="282" x2="211.0" y2="298" stroke="#586b84" stroke-width="2" stroke-linecap="round"/><text x="211.0" y="326" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#586b84">2</text><line x1="317.0" y1="282" x2="317.0" y2="298" stroke="#586b84" stroke-width="2" stroke-linecap="round"/><text x="317.0" y="326" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#586b84">4</text><line x1="423.0" y1="282" x2="423.0" y2="298" stroke="#586b84" stroke-width="2" stroke-linecap="round"/><text x="423.0" y="326" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#586b84">6</text><line x1="529.0" y1="282" x2="529.0" y2="298" stroke="#586b84" stroke-width="2" stroke-linecap="round"/><text x="529.0" y="326" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#586b84">8</text><line x1="635.0" y1="282" x2="635.0" y2="298" stroke="#586b84" stroke-width="2" stroke-linecap="round"/><text x="635.0" y="326" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#586b84">10</text><line x1="741.0" y1="282" x2="741.0" y2="298" stroke="#586b84" stroke-width="2" stroke-linecap="round"/><text x="741.0" y="326" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#586b84">12</text><line x1="847.0" y1="282" x2="847.0" y2="298" stroke="#586b84" stroke-width="2" stroke-linecap="round"/><text x="847.0" y="326" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#586b84">14</text><circle cx="158.0" cy="256" r="10" fill="#356dda"/><circle cx="211.0" cy="256" r="10" fill="#356dda"/><circle cx="211.0" cy="234" r="10" fill="#356dda"/><circle cx="264.0" cy="256" r="10" fill="#356dda"/><circle cx="741.0" cy="256" r="10" fill="#ee9a32"/><line x1="211.0" y1="281" x2="211.0" y2="387" stroke="#15978f" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,6"/><text x="223.0" y="380" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#15978f">Median = 2</text><line x1="317.0" y1="281" x2="317.0" y2="432" stroke="#d55264" stroke-width="3" stroke-linecap="round" stroke-dasharray="6,6"/><text x="329.0" y="425" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#d55264">Mean = 4</text><rect x="618" y="370" width="239" height="88" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><text x="638" y="410" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#ee9a32">Outlier: 12</text><text x="638" y="439" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#586b84">affects the mean</text><line x1="48" y1="544" x2="912" y2="544" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="48" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#586b84">Mean: (1 + 2 + 2 + 3 + 12) / 5 = 4; median: 2.</text></svg>