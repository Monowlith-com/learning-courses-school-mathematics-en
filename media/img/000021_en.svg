<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Intercept theorem: height from a shadow</title><desc>A pole 1.5 metres high with a 2 metre shadow and a mast with a 12 metre shadow form similar right-angled triangles. Equal ratios give a height of 9 metres.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1"/><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1"/><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Intercept theorem: height from a shadow</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Parallel sun rays and similar triangles</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><line x1="75.00" y1="472.00" x2="825.00" y2="472.00" stroke="#253d59" stroke-width="3" stroke-linecap="round"/><line x1="145.00" y1="472.00" x2="145.00" y2="412.00" stroke="#286fba" stroke-width="6" stroke-linecap="round"/><line x1="145.00" y1="412.00" x2="225.00" y2="472.00" stroke="#bc6924" stroke-width="3" stroke-linecap="round"/><rect x="145" y="461" width="11" height="11" fill="none" stroke="#61758a" rx="0" stroke-width="1.5"/><text x="78" y="437" fill="#286fba" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">1.5 m</text><text x="187" y="503" fill="#bc6924" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">2 m</text><line x1="440.00" y1="472.00" x2="440.00" y2="220.00" stroke="#286fba" stroke-width="6" stroke-linecap="round"/><line x1="440.00" y1="220.00" x2="776.00" y2="472.00" stroke="#bc6924" stroke-width="3" stroke-linecap="round"/><rect x="440" y="460" width="12" height="12" fill="none" stroke="#61758a" rx="0" stroke-width="1.5"/><text x="461" y="299" fill="#286fba" font-size="20" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">h = 9 m</text><text x="607" y="503" fill="#bc6924" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">12 m</text><text x="183" y="361" fill="#253d59" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Pole</text><text x="600" y="160" fill="#253d59" font-size="18" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Mast</text><text x="450" y="552" fill="#253d59" font-size="21" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">1.5 / 2 = h / 12    ⇒    h = 9 m</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">The sun rays are parallel; the two triangles use different scales.</text></svg>