<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Conditional probability: an alert is not damage</title><desc>Tree diagram: 100 out of 1,000 files are damaged, of which 80 are flagged and 20 are not. Of 900 intact files, 90 are flagged and 810 are not. The probability of damage given a flag is 80 out of 170, about 47.1 per cent.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1"/><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1"/><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Conditional probability: an alert is not damage</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">1,000 files: some damaged, others intact</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><rect x="35" y="272" width="166" height="65" fill="#dcecff" stroke="#286fba" rx="9" stroke-width="2"/><text x="118" y="310" fill="#253d59" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">1,000 files</text><line x1="201.00" y1="305.00" x2="285.00" y2="218.00" stroke="#bc6924" stroke-width="2.5" stroke-linecap="round"/><polygon points="285.00,218.00 281.88,228.55 274.57,221.49" fill="#bc6924" stroke="#bc6924" stroke-width="0"/><rect x="292" y="192" width="204" height="54" fill="#ffffff" stroke="#bc6924" rx="8" stroke-width="2"/><text x="394" y="225" fill="#253d59" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">damaged: 100</text><line x1="201.00" y1="305.00" x2="285.00" y2="418.00" stroke="#286fba" stroke-width="2.5" stroke-linecap="round"/><polygon points="285.00,418.00 275.10,413.20 283.26,407.14" fill="#286fba" stroke="#286fba" stroke-width="0"/><rect x="292" y="392" width="204" height="54" fill="#ffffff" stroke="#286fba" rx="8" stroke-width="2"/><text x="394" y="425" fill="#253d59" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">intact: 900</text><line x1="496.00" y1="218.00" x2="579.00" y2="160.00" stroke="#bc6924" stroke-width="2.5" stroke-linecap="round"/><polygon points="579.00,160.00 573.91,169.75 568.09,161.43" fill="#bc6924" stroke="#bc6924" stroke-width="0"/><rect x="583" y="137" width="231" height="48" fill="#ffe7cf" stroke="#bc6924" rx="7" stroke-width="2"/><text x="699" y="166" fill="#253d59" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">alert: 80</text><line x1="496.00" y1="218.00" x2="579.00" y2="262.00" stroke="#61758a" stroke-width="2.5" stroke-linecap="round"/><polygon points="579.00,262.00 568.00,261.92 572.76,252.94" fill="#61758a" stroke="#61758a" stroke-width="0"/><rect x="583" y="239" width="231" height="48" fill="#ffe7cf" stroke="#61758a" rx="7" stroke-width="2"/><text x="699" y="268" fill="#253d59" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">no alert: 20</text><line x1="496.00" y1="418.00" x2="579.00" y2="363.00" stroke="#bc6924" stroke-width="2.5" stroke-linecap="round"/><polygon points="579.00,363.00 573.67,372.62 568.06,364.16" fill="#bc6924" stroke="#bc6924" stroke-width="0"/><rect x="583" y="340" width="231" height="48" fill="#ffe7cf" stroke="#bc6924" rx="7" stroke-width="2"/><text x="699" y="369" fill="#253d59" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">alert: 90</text><line x1="496.00" y1="418.00" x2="579.00" y2="465.00" stroke="#61758a" stroke-width="2.5" stroke-linecap="round"/><polygon points="579.00,465.00 568.01,464.61 573.01,455.77" fill="#61758a" stroke="#61758a" stroke-width="0"/><rect x="583" y="442" width="231" height="48" fill="#ffe7cf" stroke="#61758a" rx="7" stroke-width="2"/><text x="699" y="471" fill="#253d59" font-size="17" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">no alert: 810</text><text x="450" y="533" fill="#61758a" font-size="16" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">Of the 170 flagged files, 80 are damaged:</text><text x="450" y="564" fill="#253d59" font-size="19" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="middle">P(damaged | alert) = 80 / 170 ≈ 47.1 %</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">The 80% detection rate (80/100) answers a different question.</text></svg>