<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Bei zusammengesetzten Funktionen multipliziert man die äußere mit der inneren Ableitung."><title>The chain rule as a chain of functions</title><desc>For composite functions, multiply the outer derivative by the inner derivative.</desc><rect width="960" height="600" fill="#ffffff"/><rect x="0" y="0" width="960" height="9" fill="#ffffff"/><text x="48" y="52" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#192b47">The chain rule as a chain of functions</text><line x1="48" y1="92" x2="912" y2="92" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><rect x="65" y="159" width="239" height="179" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><rect x="65" y="159" width="239" height="7" rx="0" fill="#356dda"/><text x="185" y="209" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#192b47">Input</text><text x="185" y="253" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#356dda">x</text><rect x="365" y="159" width="239" height="179" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><rect x="365" y="159" width="239" height="7" rx="0" fill="#15978f"/><text x="485" y="209" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#192b47">Inner function</text><text x="485" y="253" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#15978f">u = x² + 1</text><text x="485" y="298" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#586b84">u’ = 2x</text><rect x="660" y="159" width="239" height="179" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><rect x="660" y="159" width="239" height="7" rx="0" fill="#ee9a32"/><text x="780" y="209" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#192b47">Outer function</text><text x="780" y="253" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#ee9a32">y = u³</text><text x="780" y="298" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#586b84">dy/du = 3u²</text><line x1="305" y1="251" x2="350" y2="251" stroke="#356dda" stroke-width="3" stroke-linecap="round"/><polygon points="350.0,251.0 339.4,256.5 339.4,245.5" fill="#356dda"/><line x1="606" y1="251" x2="650" y2="251" stroke="#356dda" stroke-width="3" stroke-linecap="round"/><polygon points="650.0,251.0 639.4,256.5 639.4,245.5" fill="#356dda"/><rect x="132" y="392" width="698" height="73" rx="9" fill="#e9f7f5" stroke="#bde1d9" stroke-width="2"/><text x="480" y="437" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#15978f">dy/dx = 3 · (x² + 1)² · 2x</text><line x1="48" y1="544" x2="912" y2="544" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="48" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#586b84">Identify the inner and outer functions first, then differentiate.</text></svg>