<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" width="900" height="630" role="img"><title>Scalar product: projection and angle</title><desc>Two vectors from the origin: u points right and v points diagonally up to the right. The perpendicular from v to the u-axis meets the tip of u; the angle is 45 degrees and the scalar product is one.</desc><rect x="0" y="0" width="900" height="630" fill="#ffffff" stroke="none" rx="0" stroke-width="1"/><rect x="18" y="16" width="864" height="594" fill="#ffffff" stroke="#b5c7d8" rx="17" stroke-width="1"/><text x="43" y="51" fill="#253d59" font-size="26" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">Scalar product: projection and angle</text><text x="43" y="82" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">u = (1, 0), v = (1, 1), angle 45°</text><line x1="35.00" y1="102.00" x2="865.00" y2="102.00" stroke="#dce5ed" stroke-width="2" stroke-linecap="round"/><line x1="110.00" y1="475.00" x2="615.00" y2="475.00" stroke="#253d59" stroke-width="2" stroke-linecap="round"/><line x1="290.00" y1="511.00" x2="290.00" y2="176.00" stroke="#253d59" stroke-width="2" stroke-linecap="round"/><text x="590" y="501" fill="#253d59" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">x</text><text x="306" y="190" fill="#253d59" font-size="19" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">y</text><line x1="290.00" y1="475.00" x2="465.00" y2="475.00" stroke="#286fba" stroke-width="5" stroke-linecap="round"/><polygon points="465.00,475.00 455.24,480.08 455.24,469.92" fill="#286fba" stroke="#286fba" stroke-width="0"/><line x1="290.00" y1="475.00" x2="465.00" y2="300.00" stroke="#bc6924" stroke-width="5" stroke-linecap="round"/><polygon points="465.00,300.00 461.69,310.49 454.51,303.31" fill="#bc6924" stroke="#bc6924" stroke-width="0"/><line x1="465.00" y1="300.00" x2="465.00" y2="475.00" stroke="#61758a" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 5"/><polyline points="453.00,475.00 453.00,463.00 465.00,463.00" fill="none" stroke="#61758a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="355.00,475.00 354.99,473.87 354.96,472.73 354.91,471.60 354.84,470.47 354.75,469.33 354.64,468.21 354.52,467.08 354.37,465.95 354.20,464.83 354.01,463.71 353.81,462.60 353.58,461.49 353.33,460.38 353.07,459.28 352.79,458.18 352.48,457.08 352.16,456.00 351.82,454.91 351.46,453.84 351.08,452.77 350.68,451.71 350.27,450.65 349.83,449.60 349.38,448.56 348.91,447.53 348.42,446.51 347.92,445.49 347.39,444.48 346.85,443.49 346.29,442.50 345.72,441.52 345.12,440.56 344.51,439.60 343.89,438.65 343.24,437.72 342.59,436.79 341.91,435.88 341.22,434.98 340.51,434.09 339.79,433.22 339.06,432.36 338.30,431.51 337.54,430.67 336.76,429.85 335.96,429.04" fill="none" stroke="#b44854" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="363" y="444" fill="#b44854" font-size="20" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">45°</text><text x="450" y="516" fill="#286fba" font-size="19" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">u = (1, 0)</text><text x="485" y="292" fill="#bc6924" font-size="19" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">v = (1, 1)</text><text x="632" y="310" fill="#253d59" font-size="19" font-weight="700" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">u · v = 1</text><text x="632" y="350" fill="#253d59" font-size="16" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">cos(45°) = 1/√2</text><text x="45" y="586" fill="#61758a" font-size="15" font-weight="400" font-family="DejaVu Sans, Arial, sans-serif" text-anchor="start">The dashed line is the orthogonal projection of v onto the x-axis.</text></svg>