<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Beide Geraden schneiden sich exakt bei (4,3) und lösen so das lineare Gleichungssystem.">
<title>Two lines, one solution</title>
<desc>The two lines intersect at exactly (4, 3), solving the simultaneous linear equations.</desc>
