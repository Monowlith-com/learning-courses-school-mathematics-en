<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Die drei geometrischen Maßarten im direkten Vergleich."><title>Length, area and volume</title><desc>A direct comparison of three types of geometric measurement.</desc><rect width="960" height="600" fill="#ffffff"/><rect x="0" y="0" width="960" height="9" fill="#ffffff"/><text x="48" y="52" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#192b47">Length, area and volume</text><line x1="48" y1="92" x2="912" y2="92" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><rect x="65" y="145" width="234" height="340" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><text x="182" y="188" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#192b47">1 dimension</text><text x="182" y="448" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#356dda">Length: cm</text><rect x="370" y="145" width="234" height="340" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><text x="487" y="188" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#192b47">2 dimensions</text><text x="487" y="448" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#356dda">Area: cm²</text><rect x="675" y="145" width="234" height="340" rx="12" fill="#f5f8fc" stroke="#e6edf5" stroke-width="2"/><text x="792" y="188" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="700" fill="#192b47">3 dimensions</text><text x="792" y="448" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#356dda">Volume: cm³</text><line x1="112" y1="323" x2="245" y2="323" stroke="#356dda" stroke-width="7" stroke-linecap="round"/><polygon points="245.0,323.0 234.4,328.5 234.4,317.5" fill="#356dda"/><circle cx="112" cy="323" r="5" fill="#ee9a32"/><rect x="428" y="268" width="116" height="116" rx="1" fill="#dceafa" stroke="#356dda" stroke-width="3"/><path d="M 727 290 L 817 290 L 855 258 L 765 258 Z" fill="#dceafa" stroke="#356dda" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 727 290 L 817 290 L 817 393 L 727 393 Z" fill="#c5e4ee" stroke="#356dda" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 817 290 L 855 258 L 855 361 L 817 393 Z" fill="#afd5ee" stroke="#356dda" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="475" y="399" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="400" fill="#586b84">a × b</text><line x1="48" y1="544" x2="912" y2="544" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="48" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#586b84">Moving to the next dimension changes the unit as well.</text></svg>