<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Wahrscheinlichkeit für genau k Erfolge bei sechs unabhängigen Versuchen mit p gleich 0,5."><title>Binomial distribution: six trials</title><desc>Probability of exactly k successes in six independent trials with p = 0.5.</desc><rect width="960" height="600" fill="#ffffff"/><rect x="0" y="0" width="960" height="9" fill="#ffffff"/><text x="48" y="52" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#192b47">Binomial distribution: six trials</text><line x1="48" y1="92" x2="912" y2="92" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><rect x="142" y="436.5" width="63" height="11.5" rx="4" fill="#356dda"/><text x="173" y="421.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#356dda">1/64</text><text x="173" y="481" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#192b47">0</text><rect x="247" y="379.0" width="63" height="69.0" rx="4" fill="#356dda"/><text x="278" y="364.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#356dda">6/64</text><text x="278" y="481" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#192b47">1</text><rect x="352" y="275.5" width="63" height="172.5" rx="4" fill="#356dda"/><text x="383" y="260.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#356dda">15/64</text><text x="383" y="481" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#192b47">2</text><rect x="457" y="218.0" width="63" height="230.0" rx="4" fill="#15978f"/><text x="488" y="203.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#15978f">20/64</text><text x="488" y="481" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#192b47">3</text><rect x="562" y="275.5" width="63" height="172.5" rx="4" fill="#356dda"/><text x="593" y="260.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#356dda">15/64</text><text x="593" y="481" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#192b47">4</text><rect x="667" y="379.0" width="63" height="69.0" rx="4" fill="#356dda"/><text x="698" y="364.0" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#356dda">6/64</text><text x="698" y="481" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#192b47">5</text><rect x="772" y="436.5" width="63" height="11.5" rx="4" fill="#356dda"/><text x="803" y="421.5" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="700" fill="#356dda">1/64</text><text x="803" y="481" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#192b47">6</text><line x1="118" y1="448" x2="860" y2="448" stroke="#192b47" stroke-width="2" stroke-linecap="round"/><text x="488" y="507" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#586b84">Number of successes k</text><line x1="48" y1="544" x2="912" y2="544" stroke="#e6edf5" stroke-width="2" stroke-linecap="round"/><text x="48" y="572" text-anchor="start" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#586b84">The seven probabilities add up to 1.</text></svg>